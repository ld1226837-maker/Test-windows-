name: Windows CI and Release

# Every push to main and every pull request runs the full quality gate.
# Publishing a GitHub Release happens ONLY when every job below succeeded AND
#   - a tag like v0.1.0 is pushed (must equal "version" in src-tauri/tauri.conf.json), or
#   - the workflow is started manually with "publish" ticked.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release if every check passes"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"
  # Hard size gates: the build fails (and nothing is published) above these.
  MAX_INSTALLER_MB: "10"   # Windows setup.exe
  MAX_APK_MB: "10"         # each Android APK (one per CPU architecture)

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend gate: typecheck, lint, unit tests, seeder/load-test checks, build
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (app + scripts)
        run: npm run typecheck:all

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Math, section and seeder checks
        run: |
          npm run verify:math
          npm run verify:sections

      - name: Load tests (light + medium)
        run: |
          npm run verify:loadtest:light
          npm run verify:loadtest:medium

      - name: Production web build
        run: npm run build

      - name: Build output must exist
        run: test -s .output/public/index.html

  # ---------------------------------------------------------------------------
  # 2. Rust gate: the Tauri shell and the android-save plugin
  # ---------------------------------------------------------------------------
  rust:
    name: Rust check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: write   # only used to commit a refreshed Cargo.lock on pushes to main
    steps:
      - uses: actions/checkout@v6

      - name: Linux system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build needs the frontendDist folder to exist; the real build is
      # verified in the quality job, so a placeholder is enough here.
      - name: Placeholder frontend for tauri-build
        run: |
          mkdir -p .output/public
          echo '<!doctype html><title>ci</title>' > .output/public/index.html

      # NOT "--locked" on purpose: the committed Cargo.lock is behind
      # Cargo.toml (it lacks keyring and tauri-plugin-android-save). The
      # drift step below hands you a refreshed lockfile to commit; after
      # committing it, add --locked back to both commands.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test

      - name: Detect Cargo.lock drift
        id: drift
        run: |
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::src-tauri/Cargo.lock was behind Cargo.toml and has been refreshed."
          fi

      # On pushes to main the refreshed lockfile is committed for you, so the
      # warning goes away on the next run. (Run "git pull --rebase" locally
      # before your next push.) Pull requests get the artifact instead.
      - name: Commit refreshed Cargo.lock
        if: steps.drift.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/Cargo.lock
          git commit -m "chore: refresh Cargo.lock [skip ci]"
          git push

      - name: Upload refreshed Cargo.lock
        if: steps.drift.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Cargo.lock-refreshed
          path: src-tauri/Cargo.lock
          retention-days: 14

      # Advisory only: differences become a warning annotation, not a failure.
      # Make these strict by removing the "|| echo" parts.
      - name: cargo fmt (advisory)
        working-directory: src-tauri
        run: cargo fmt --all -- --check || echo "::warning::rustfmt found formatting differences (advisory)"

      - name: cargo clippy (advisory)
        working-directory: src-tauri
        run: cargo clippy --all-targets || echo "::warning::clippy reported problems (advisory)"

  # ---------------------------------------------------------------------------
  # 3. Build the Windows installer (only after both gates pass)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows installer
    needs: [quality, rust]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      # tauri.conf.json: targets ["nsis"], beforeBuildCommand "npm run build".
      - name: Build NSIS installer
        run: npx tauri build

      - name: Collect installer and checksums
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p dist
          EXE=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n1)
          test -n "$EXE"
          cp "$EXE" "dist/truff-windows-v${VERSION}-setup.exe"
          cd dist
          ls -l
          sha256sum *.exe > SHA256SUMS.txt

      - name: Installer size report and gate
        run: |
          set -uo pipefail
          APP=$(find src-tauri/target/release -maxdepth 1 -name '*.exe' | head -n1)
          fail=0
          { echo "### Windows sizes (limit ${MAX_INSTALLER_MB} MB installer)"; echo; echo "| file | MB |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for f in "$APP" dist/*.exe; do
            bytes=$(stat -c%s "$f")
            mb=$(awk -v b="$bytes" 'BEGIN{printf "%.2f", b/1048576}')
            echo "$(basename "$f"): ${mb} MB"
            echo "| $(basename "$f") | ${mb} |" >> "$GITHUB_STEP_SUMMARY"
          done
          bytes=$(stat -c%s dist/*.exe)
          if [ "$bytes" -gt $((MAX_INSTALLER_MB * 1048576)) ]; then
            echo "::error::Installer is $((bytes / 1048576)) MB, above the ${MAX_INSTALLER_MB} MB limit. Check webviewInstallMode in tauri.conf.json (offlineInstaller embeds ~180 MB)."
            fail=1
          fi
          exit $fail

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('dist/*') != ''
        with:
          name: windows-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish (runs only if EVERYTHING above succeeded)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [quality, rust, build-windows]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: dist

      - name: Release name and type
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Truff Snacks Windows ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
