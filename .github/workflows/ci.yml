name: Windows CI and Release

# Every push to main and every pull request runs the full quality gate.
# Whenever the build job produces its artifacts, they are PUBLISHED automatically
# as a GitHub Release (no manual step):
#   - push to main  -> pre-release tagged build-<run number>
#   - tag v0.1.0    -> release (tag must equal "version" in src-tauri/tauri.conf.json)
#   - manual run    -> pre-release tagged build-<run number>
# Pull requests only build and upload the workflow artifact; they never publish.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"
  # The app computes business dates in IST; run tests in the same zone.
  TZ: "Asia/Kolkata"
  # Hard size gates: the build fails (and nothing is published) above these.
  MAX_INSTALLER_MB: "10"   # Windows setup.exe
  MAX_APK_MB: "75"         # each Android APK (one per CPU architecture)

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend gate: typecheck, lint, unit tests, seeder/load-test checks, build
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (app + scripts)
        run: npm run typecheck:all

      # Check only: CI never rewrites or pushes code. Run `npm run format` locally.
      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Math, section and seeder checks
        run: |
          npm run verify:math
          npm run verify:sections

      - name: Load tests (light + medium)
        run: |
          npm run verify:loadtest:light
          npm run verify:loadtest:medium

      - name: Production web build
        run: npm run build

      - name: Build output must exist
        run: test -s .output/public/index.html

  # ---------------------------------------------------------------------------
  # 2. Rust gate: the Tauri shell and the android-save plugin
  # ---------------------------------------------------------------------------
  rust:
    name: Rust check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Linux system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build needs the frontendDist folder to exist; the real build is
      # verified in the quality job, so a placeholder is enough here.
      - name: Placeholder frontend for tauri-build
        run: |
          mkdir -p .output/public
          echo '<!doctype html><title>ci</title>' > .output/public/index.html

      # --locked: the committed Cargo.lock is the source of truth. The build
      # fails if it is out of sync with Cargo.toml (fix: run `cargo update -w`
      # in src-tauri and commit Cargo.lock), so releases are reproducible.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # Advisory only: differences become a warning annotation, not a failure.
      # Make these strict by removing the "|| echo" parts.
      - name: cargo fmt (advisory)
        working-directory: src-tauri
        run: cargo fmt --all -- --check || echo "::warning::rustfmt found formatting differences (advisory)"

      - name: cargo clippy (advisory)
        working-directory: src-tauri
        run: cargo clippy --all-targets || echo "::warning::clippy reported problems (advisory)"

  # ---------------------------------------------------------------------------
  # 3. Build the Windows installer (only after both gates pass)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows installer
    needs: [quality, rust]
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      # The custom icon must be a real multi-size .ico, otherwise Windows falls
      # back to a generic icon.
      - name: Verify custom Windows icon
        run: |
          python -c "
          import struct,sys
          d=open('src-tauri/icons/icon.ico','rb').read()
          n=struct.unpack('<H',d[4:6])[0]
          sizes=[(d[6+16*i] or 256) for i in range(n)]
          print('icon.ico sizes:',sizes)
          sys.exit(0 if 256 in sizes and 32 in sizes and 16 in sizes else 1)
          "

      # Rebuild the app crate (not its dependencies) so the exe icon resource is
      # always re-embedded, even when rust-cache restored an older build.
      - name: Force icon re-embed
        run: cargo clean --release -p turf-ledger --manifest-path src-tauri/Cargo.toml

      # tauri.conf.json: targets ["nsis"], beforeBuildCommand "npm run build".
      - name: Build NSIS installer
        run: npx tauri build

      - name: Collect installer and checksums
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          mkdir -p dist
          EXE=$(find src-tauri/target/release/bundle/nsis -name '*-setup.exe' | head -n1)
          test -n "$EXE"
          # Non-tag builds carry the short commit id so each build is identifiable.
          SUFFIX=""; [ "${GITHUB_REF_TYPE}" = "tag" ] || SUFFIX="-${GITHUB_SHA::7}"
          cp "$EXE" "dist/truff-windows-v${VERSION}${SUFFIX}-setup.exe"
          cd dist
          ls -l
          sha256sum *.exe > SHA256SUMS.txt

      - name: Installer size report and gate
        run: |
          set -uo pipefail
          APP=$(find src-tauri/target/release -maxdepth 1 -name '*.exe' | head -n1)
          fail=0
          { echo "### Windows sizes (limit ${MAX_INSTALLER_MB} MB installer)"; echo; echo "| file | MB |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for f in "$APP" dist/*.exe; do
            bytes=$(stat -c%s "$f")
            mb=$(awk -v b="$bytes" 'BEGIN{printf "%.2f", b/1048576}')
            echo "$(basename "$f"): ${mb} MB"
            echo "| $(basename "$f") | ${mb} |" >> "$GITHUB_STEP_SUMMARY"
          done
          bytes=$(stat -c%s dist/*.exe)
          if [ "$bytes" -gt $((MAX_INSTALLER_MB * 1048576)) ]; then
            echo "::error::Installer is $((bytes / 1048576)) MB, above the ${MAX_INSTALLER_MB} MB limit. Check webviewInstallMode in tauri.conf.json (offlineInstaller embeds ~180 MB)."
            fail=1
          fi
          exit $fail

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('dist/*') != ''
        with:
          name: windows-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish (runs only if EVERYTHING above succeeded)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [quality, rust, build-windows]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: windows-installer
          path: dist

      - name: Release name and type
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          if [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Truff Snacks Windows ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt

      # Keep the 10 newest build-N pre-releases; delete older ones and their tags.
      - name: Prune old build pre-releases
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '[.[] | select(.tagName | startswith("build-"))] | .[10:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            done
