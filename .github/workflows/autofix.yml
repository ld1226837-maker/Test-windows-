name: Auto-fix lint and formatting

# Runs ESLint --fix (which also applies Prettier formatting to .ts/.tsx through
# eslint-plugin-prettier) on every push to main and on pull requests from this
# repo, then commits the result back. It only changes what ESLint can fix.
# It never runs `prettier --write .` (that rewrote workflow files, generated
# files like routeTree.gen.ts, snapshots and docs) and never commits anything
# under .github/ (GitHub blocks the built-in token from changing workflows). Type errors and failing tests are never edited
# automatically; the main CI workflow still reports those.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  autofix:
    # Skip fork PRs (the token cannot push to a fork) and our own fix commits.
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'push' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      - name: ESLint --fix
        run: npx eslint . --fix || true

      - name: Commit fixes, if any
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            # Never commit workflow files; the built-in token may not change them.
            git checkout -- .github 2>/dev/null || true
            git add -A -- . ':!.github'
            git diff --cached --quiet && { echo "Nothing to commit."; exit 0; }
            git commit -m "chore: auto-fix lint and formatting"
            git push
          else
            echo "Nothing to fix."
          fi

      - name: Report what could not be fixed automatically
        run: |
          npm run typecheck:all
          npm run lint
